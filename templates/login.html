<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - Smart GST Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1f1f2e, #2c2c2c);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD */
.container {
  width: 500px;
  padding: 50px;
  background: #f5f5f5;
  border-radius: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* TEXT */
h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #111;
}

.subtitle {
  font-size: 15px;
  color: #555;
  margin-bottom: 30px;
}

/* LABEL */
label {
  font-size: 14px;
  font-weight: 500;
  color: #222;
}

/* INPUT */
input {
  width: 100%;
  padding: 15px 45px 15px 15px;
  margin-top: 8px;
  margin-bottom: 22px;
  border-radius: 18px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 14px;
  background: #e3e7ee;
}

input:focus {
  border-color: #0072ff;
  background: #eef3ff;
}

/* PASSWORD BOX */
.password-box {
  position: relative;
}

/* EYE ICON */
.toggle-password {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  width: 22px;
  height: 22px;
  opacity: 0.7;
  transition: 0.3s;
}

.toggle-password:hover {
  opacity: 1;
  transform: translateY(-50%) scale(1.15);
}

/* BUTTON */
.btn {
  width: 100%; /* full width */
  position: relative;
  overflow: hidden;
  padding: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 16px;
  transition: all 0.3s ease;
}

/* POP EFFECT */
.btn:hover {
  transform: scale(1.05);
}

/* SHINE EFFECT */
.btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.7), transparent);
  transition: 0.6s;
}

.btn:hover::before {
  left: 100%;
}

/* COLORS */
.login-btn {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  margin-bottom: 12px; /* space between buttons */
}

.signup-btn {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

/* FLASH */
.flash {
  background: #ffebee;
  color: #c62828;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

  <h1 id="greeting">Hello Again!!</h1>
  <div class="subtitle">Login to your Smart GST Calculator</div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">
        {% for message in messages %}
          {{ message }}<br>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="/login">

    <label>Email</label>
    <input type="email" name="email" id="email" placeholder="your@email.com" required>

    <label>Password</label>
    <div class="password-box">
      <input type="password" id="password" name="password" placeholder="Your password" required>

      <svg onclick="togglePassword()" class="toggle-password" id="eyeIcon" viewBox="0 0 24 24" fill="none">
        <path d="M1 12C3.5 7.5 7.5 5 12 5C16.5 5 20.5 7.5 23 12C20.5 16.5 16.5 19 12 19C7.5 19 3.5 16.5 1 12Z" stroke="#555" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3" stroke="#555" stroke-width="1.6"/>
      </svg>
    </div>

    <!-- VERTICAL BUTTONS -->
    <button class="btn login-btn" type="submit">Login</button>
    <a href="/signup" class="btn signup-btn">Sign Up</a>

  </form>

</div>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if (password.type === "password") {
    password.type = "text";
    eyeIcon.innerHTML = `
      <path d="M2 2L22 22" stroke="#555" stroke-width="1.6"/>
      <path d="M1 12C3.5 7.5 7.5 5 12 5C14 5 15.8 5.6 17.4 6.6M23 12C20.5 16.5 16.5 19 12 19C10 19 8.2 18.4 6.6 17.4" stroke="#555" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="3" stroke="#555" stroke-width="1.6"/>
    `;
  } else {
    password.type = "password";
    eyeIcon.innerHTML = `
      <path d="M1 12C3.5 7.5 7.5 5 12 5C16.5 5 20.5 7.5 23 12C20.5 16.5 16.5 19 12 19C7.5 19 3.5 16.5 1 12Z" stroke="#555" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="3" stroke="#555" stroke-width="1.6"/>
    `;
  }
}

/* GREETING */
const emailInput = document.getElementById("email");
const greeting = document.getElementById("greeting");

emailInput.addEventListener("blur", () => {
  const email = emailInput.value.trim();
  if (!email) return;

  let users = JSON.parse(localStorage.getItem("visitedUsers")) || [];

  if (users.includes(email)) {
    greeting.textContent = "Hello Again!!";
  } else {
    greeting.textContent = "Hello, Welcome!!!";
    users.push(email);
    localStorage.setItem("visitedUsers", JSON.stringify(users));
  }
});
</script>

</body>
</html>
